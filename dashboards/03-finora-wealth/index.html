<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finora Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    /* Layout: header, four score cards (3 stat + products carousel), then a view-switching holdings panel; AI assistant floats bottom-centre */
    :root {
      --bg: #F4F5F7;
      --card: #FFFFFF;
      --ink: #111317;
      --mute: #8A8F98;
      --line: #ECEEF1;
      --lime: #C0E800;
      --lime-2: #D4F542;
      --green: #12C26A;
      --red: #F0303A;
      --blue: #2E7BF6;
      --char: #1E293B;
      --font: "Manrope", system-ui, sans-serif;
      --ease: cubic-bezier(.2, .8, .2, 1);
      color-scheme: light;
    }
    [hidden] { display: none !important; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font); }
    button { font-family: var(--font); color: inherit; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 40px) 150px; }

    /* ---------- Nav ---------- */
    .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
    .logo { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 26px; font-style: italic; letter-spacing: -.03em; }
    .logo svg { width: 26px; height: 30px; }
    .caps { display: flex; gap: 8px; }
    .caps button { display: inline-flex; align-items: center; gap: 8px; height: 46px; min-width: 46px; padding: 0 14px; border-radius: 999px; border: 0; background: #fff; box-shadow: 0 1px 2px rgba(17,19,23,.06); font-size: 16px; font-weight: 600; transition: background .25s, padding .25s; }
    .caps button span { display: none; }
    .caps button[aria-current="page"] { background: #E8EAEE; padding: 0 20px; }
    .caps button[aria-current="page"] span { display: inline; font-style: italic; }
    .caps svg { width: 18px; height: 18px; }
    .end { justify-self: end; display: flex; align-items: center; gap: 12px; }
    .me { display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 0; }
    .me i { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(140deg, #F2B47A, #7A3E1C); display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 700; font-size: 14px; }
    .me b { display: block; font-size: 15px; font-weight: 600; font-style: italic; }
    .me small { display: block; font-size: 12px; color: var(--mute); font-style: italic; }
    .ic { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; display: grid; place-items: center; position: relative; box-shadow: 0 1px 2px rgba(17,19,23,.06); }
    .ic svg { width: 18px; height: 18px; }
    .ic .dot { position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }

    /* ---------- Score row ---------- */
    .scores { display: grid; grid-template-columns: repeat(3, 1fr) 1.55fr; gap: 16px; margin-top: 30px; }
    .sc { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 252px; padding: 22px; border-radius: 24px; background: var(--card); box-shadow: 0 1px 2px rgba(17,19,23,.04); overflow: hidden; transition: transform .3s var(--ease), box-shadow .3s; }
    .sc:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -24px rgba(17,19,23,.35); }
    .sc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .badge { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; flex: none; }
    .badge svg { width: 24px; height: 24px; }
    .b-lime { background: var(--lime); }
    .b-green { background: var(--green); color: #fff; }
    .b-dark { background: #3A3D42; color: #fff; }
    .sc-title { font-size: 16px; font-weight: 600; font-style: italic; text-align: right; }
    .chg { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; font-style: italic; font-variant-numeric: tabular-nums; }
    .chg i { width: 18px; height: 18px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
    .chg i svg { width: 10px; height: 10px; }
    .lab { font-size: 13px; color: var(--mute); font-style: italic; }
    .amt { margin-top: 8px; font-size: clamp(28px, 2.4vw, 34px); font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .amt small { font-size: 13px; color: var(--mute); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
    .spark { position: absolute; left: 0; right: 0; top: 96px; height: 64px; opacity: .9; pointer-events: none; }
    .spark svg { width: 100%; height: 100%; }

    .prod { padding: 20px; }
    .prod-head { display: flex; justify-content: space-between; align-items: baseline; }
    .prod-head h2 { margin: 0; font-size: 20px; font-weight: 600; font-style: italic; }
    .prod-head a { font-size: 12px; color: var(--mute); font-style: italic; text-decoration: none; }
    .rail { position: relative; margin-top: 14px; }
    .track { display: grid; grid-auto-flow: column; grid-auto-columns: calc(50% - 6px); gap: 12px; overflow: hidden; scroll-behavior: smooth; }
    .pc { padding: 14px; border-radius: 16px; background: #F7F8FA; display: flex; flex-direction: column; min-width: 0; }
    .pc-top { display: flex; justify-content: space-between; gap: 8px; }
    .pc small { font-size: 11px; color: var(--mute); font-style: italic; }
    .pc h4 { margin: 4px 0 0; font-size: 15px; font-weight: 600; font-style: italic; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pc .go { width: 26px; height: 26px; border: 0; background: none; display: grid; place-items: center; flex: none; }
    .pc .go svg { width: 14px; height: 14px; }
    .pc-mid { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .pc-mid b { display: block; font-size: 12px; font-weight: 600; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meter { width: 100%; }
    .meter i { display: block; height: 5px; border-radius: 3px; background: #E3E6EA; overflow: hidden; }
    .meter i::after { content: ""; display: block; height: 100%; width: var(--v); border-radius: 3px; background: var(--c); }
    .meter span { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--mute); }
    .meter span b { font-size: 10px; color: var(--ink); }
    .contrib { margin-top: 14px; height: 38px; border-radius: 999px; border: 0; background: #ECEEF1; font-size: 13px; font-weight: 500; font-style: italic; transition: background .25s; }
    .contrib:hover { background: var(--lime); }
    .contrib.done { background: var(--lime); }
    .arrow { position: absolute; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; border: 0; display: grid; place-items: center; z-index: 2; }
    .arrow svg { width: 14px; height: 14px; }
    .arrow.next { right: -8px; background: var(--lime); }
    .arrow.prev { left: -8px; background: #fff; box-shadow: 0 2px 6px rgba(17,19,23,.12); }
    .arrow:disabled { opacity: 0; pointer-events: none; }

    /* ---------- Holdings ---------- */
    .hold { margin-top: 18px; padding: 16px; border-radius: 24px; background: var(--card); box-shadow: 0 1px 2px rgba(17,19,23,.04); }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 4px 12px; }
    .seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #F4F5F7; overflow-x: auto; scrollbar-width: none; }
    .seg button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: none; font-size: 14px; font-weight: 500; font-style: italic; white-space: nowrap; transition: background .25s; }
    .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--lime); }
    .seg svg { width: 16px; height: 16px; }
    .count { font-size: 12px; color: var(--mute); margin-left: 4px; font-variant-numeric: tabular-nums; }

    .tbl { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 880px; font-size: 14px; }
    th { text-align: left; font-weight: 500; font-style: italic; color: #4A4F57; font-size: 13px; padding: 14px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
    th button svg { width: 10px; height: 14px; opacity: .55; }
    th button[data-dir] svg { opacity: 1; }
    td { padding: 13px 16px; border-bottom: 1px solid #F3F4F6; white-space: nowrap; font-style: italic; font-variant-numeric: tabular-nums; }
    tbody tr { transition: background .2s; }
    tbody tr:hover { background: #FAFBF5; }
    tbody tr:last-child td { border-bottom: 0; }
    td:nth-child(2), th:nth-child(2), td:nth-child(3), th:nth-child(3) { text-align: center; }
    th:last-child, td:last-child { text-align: right; }
    .st { font-weight: 600; }
    .st.Locked { color: var(--red); } .st.Active { color: var(--green); } .st.Matured { color: var(--blue); } .st.Pending { color: #B7791F; }
    .act { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; min-width: 132px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--lime); font-size: 12px; font-weight: 600; font-style: italic; box-shadow: 0 6px 14px -8px rgba(160,195,0,.9); transition: transform .2s var(--ease), background .2s; }
    .act:hover { transform: translateY(-1px); }
    .act svg { width: 13px; height: 13px; }
    .act.ghost { background: #ECEEF1; box-shadow: none; }
    .empty { padding: 40px; text-align: center; color: var(--mute); font-style: italic; }

    .chart { padding: 10px 6px 4px; }
    .chart svg { width: 100%; height: 360px; display: block; }
    .chart text { font-family: var(--font); font-size: 12px; fill: #4A4F57; font-style: italic; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; padding: 4px; }
    .ac { padding: 16px; border-radius: 18px; background: #F7F8FA; display: flex; flex-direction: column; gap: 10px; }
    .ac h4 { margin: 0; font-size: 15px; font-weight: 600; font-style: italic; }
    .ac .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); font-style: italic; }
    .ac .row b { color: var(--ink); font-weight: 600; }
    .ac .act { width: 100%; margin-top: 4px; }
    .news { display: grid; gap: 10px; padding: 4px; }
    .ni { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 16px; background: #F7F8FA; }
    .ni .tag { flex: none; padding: 4px 10px; border-radius: 999px; background: var(--lime); font-size: 11px; font-weight: 600; font-style: italic; }
    .ni b { display: block; font-size: 15px; font-weight: 600; font-style: italic; }
    .ni p { margin: 4px 0 0; font-size: 13px; color: var(--mute); line-height: 1.5; }
    .ni time { margin-left: auto; flex: none; font-size: 12px; color: var(--mute); }

    /* ---------- AI widget ---------- */
    .ai { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: 22px; z-index: 30; width: min(520px, calc(100vw - 32px)); padding: 12px; border-radius: 26px; background: rgba(245,246,248,.72); border: 1px solid rgba(255,255,255,.7); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); box-shadow: 0 24px 50px -24px rgba(17,19,23,.45); }
    .ai .min { position: absolute; right: 14px; top: 10px; width: 26px; height: 26px; border: 0; background: none; display: grid; place-items: center; opacity: .7; }
    .ai .min svg { width: 14px; height: 14px; }
    .ai.compact .chips, .ai.compact .ans { display: none; }
    .ai.compact .min svg { transform: rotate(180deg); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 36px 12px 4px; }
    .chips button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 0; background: #fff; font-size: 12px; font-style: italic; box-shadow: 0 1px 2px rgba(17,19,23,.08); transition: background .2s; }
    .chips button:hover { background: var(--lime-2); }
    .chips svg { width: 13px; height: 13px; }
    .ans { margin: 0 4px 10px; padding: 12px 14px; border-radius: 16px; background: #fff; font-size: 13px; line-height: 1.55; max-height: 160px; overflow-y: auto; }
    .ask { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 7px; border-radius: 999px; background: var(--char); }
    .spk { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #EAFF8A, var(--lime)); display: grid; place-items: center; flex: none; box-shadow: 0 0 18px rgba(192,232,0,.55); }
    .spk svg { width: 18px; height: 18px; }
    .ask input { flex: 1; min-width: 0; border: 0; background: transparent; color: #fff; font: italic 15px var(--font); }
    .ask input::placeholder { color: rgba(255,255,255,.75); }
    .ask input:focus { outline: none; }
    .wave { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; gap: 2px; }
    .wave i { width: 2px; height: 6px; border-radius: 2px; background: #fff; opacity: .8; }
    .wave i:nth-child(2) { height: 12px; } .wave i:nth-child(3) { height: 16px; } .wave i:nth-child(4) { height: 10px; } .wave i:nth-child(5) { height: 6px; }
    .wave.on i { animation: wv .8s ease-in-out infinite; } .wave.on i:nth-child(2) { animation-delay: .1s; } .wave.on i:nth-child(3) { animation-delay: .2s; } .wave.on i:nth-child(4) { animation-delay: .3s; }
    .caret { display: inline-block; width: 6px; height: 14px; background: var(--char); margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }

    .toast { position: fixed; left: 50%; top: 22px; z-index: 50; transform: translate(-50%, -12px); padding: 11px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; font-style: italic; opacity: 0; transition: opacity .25s, transform .3s var(--ease); pointer-events: none; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #8AA600; outline-offset: 2px; }

    .rise { opacity: 0; transform: translateY(12px); animation: rise .8s var(--ease) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .19s; } .d4 { animation-delay: .26s; } .d5 { animation-delay: .33s; } .d6 { animation-delay: .45s; } .d7 { animation-delay: .7s; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes wv { 50% { transform: scaleY(1.9); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { opacity: 1; transform: none; animation: none; } .wave.on i, .caret { animation: none; } }

    @media (max-width: 1200px) { .scores { grid-template-columns: repeat(3, 1fr); } .prod { grid-column: 1 / -1; } .sc { min-height: 220px; } }
    @media (max-width: 900px) {
      .nav { grid-template-columns: 1fr auto; }
      .caps { grid-column: 1 / -1; order: 3; justify-self: center; }
      .me div { display: none; }
      .scores { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .scores { grid-template-columns: 1fr; }
      .sc { min-height: 190px; }
      .spark { display: none; }
      .ic.opt { display: none; }
      .track { grid-auto-columns: 100%; }
      .caps button { height: 42px; min-width: 42px; }
      .ai { bottom: 12px; }
      .chips { padding-right: 30px; }
      .chips button:nth-child(n+3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav rise d1">
      <a class="logo" href="#"><svg viewBox="0 0 26 30"><path d="M4 2h18l-3 6H10v4h9l-3 6h-6v10H4Z" fill="#C0E800"/><path d="M4 2h6v26H4Z" fill="#9CC200"/></svg>Finora</a>
      <div class="caps" id="caps" role="tablist">
        <button aria-label="Home"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8 9 3l6 5v6.5A1.5 1.5 0 0 1 13.5 16h-9A1.5 1.5 0 0 1 3 14.5Z"/><path d="M7.5 16v-4h3v4"/></svg><span>Home</span></button>
        <button aria-label="Activity"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 1.5 3.5 10H9l-1 6.5L14.5 8H9Z"/></svg><span>Activity</span></button>
        <button aria-label="Watchlist"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 15.5S2.5 11.6 2.5 6.8A3.3 3.3 0 0 1 9 5.4a3.3 3.3 0 0 1 6.5 1.4C15.5 11.6 9 15.5 9 15.5Z"/></svg><span>Watchlist</span></button>
        <button aria-current="page" aria-label="Wallet"><svg viewBox="0 0 18 18" fill="currentColor"><path d="M3 4.5A2 2 0 0 1 5 2.5h8v2H5.5a.5.5 0 0 0 0 1H15a1 1 0 0 1 1 1V14a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 3 14Zm9.5 6.25a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg><span>Wallet</span></button>
        <button aria-label="Transfers"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h12l-3-3M15 11.5H3l3 3"/></svg><span>Transfers</span></button>
      </div>
      <div class="end">
        <button class="me"><i>LA</i><div><b>Leslie Alexander</b><small>Owner of Luxam Reals</small></div></button>
        <button class="ic" aria-label="Notifications"><svg viewBox="0 0 18 18" fill="currentColor"><path d="M9 2a5 5 0 0 0-5 5c0 3.3-1.5 4.9-1.5 4.9h13S14 10.3 14 7a5 5 0 0 0-5-5Zm-1.8 11.5a1.8 1.8 0 0 0 3.6 0Z"/></svg><span class="dot"></span></button>
        <button class="ic opt" aria-label="Settings"><svg viewBox="0 0 18 18" fill="currentColor"><path fill-rule="evenodd" d="M7.6 1.5h2.8l.4 2.1 1.4.8 2-.7 1.4 2.4-1.6 1.4v1.6l1.6 1.4-1.4 2.4-2-.7-1.4.8-.4 2.1H7.6l-.4-2.1-1.4-.8-2 .7-1.4-2.4L4 9.8V8.2L2.4 6.8l1.4-2.4 2 .7 1.4-.8ZM9 11.3a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6Z"/></svg></button>
        <button class="ic opt" aria-label="Help"><svg viewBox="0 0 18 18" fill="currentColor"><path fill-rule="evenodd" d="M9 1.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15ZM7.2 7a1.8 1.8 0 1 1 2.7 1.6c-.6.3-.9.8-.9 1.4v.3H7.6V10c0-1.1.6-2 1.5-2.5a.5.5 0 1 0-.6-.5Zm1.8 6.5a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8Z"/></svg></button>
      </div>
    </nav>

    <section class="scores">
      <article class="sc rise d2">
        <div class="sc-top"><span class="badge b-lime"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9h16M8 13h3M8 16h6"/></svg></span><span class="sc-title">Total Investment</span></div>
        <div><div class="lab">Total amount invested</div><div class="amt"><span data-count="3236500">3,236,500</span><small>USD</small></div></div>
      </article>
      <article class="sc rise d3">
        <div class="sc-top"><span class="badge b-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5v14h14M8 15l4-4 2.5 2.5L19 9M16 9h3v3"/></svg></span>
          <span class="chg"><i><svg viewBox="0 0 10 10" fill="#fff"><path d="M5 2 8.5 7h-7Z"/></svg></i><span id="chg">1.75% (-0.11%)</span></span></div>
        <div class="spark" aria-hidden="true"><svg viewBox="0 0 300 64" preserveAspectRatio="none"><defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12C26A" stop-opacity=".22"/><stop offset="1" stop-color="#12C26A" stop-opacity="0"/></linearGradient></defs><path id="spArea" fill="url(#sp)"/><path id="spLine" fill="none" stroke="#12C26A" stroke-width="2"/></svg></div>
        <div><div class="lab">Total Investment</div><div class="amt"><span data-count="5353353" id="liveAmt">5,353,353</span><small>USD</small></div></div>
      </article>
      <article class="sc rise d4">
        <div class="sc-top"><span class="badge b-dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m8.5 12.5 2.3 2.3 4.7-5"/></svg></span><span class="sc-title">Total Investment</span></div>
        <div><div class="lab">Total amount invested</div><div class="amt"><span data-count="5353353">5,353,353</span><small>USD</small></div></div>
      </article>
      <article class="sc prod rise d5" aria-label="My products">
        <div class="prod-head"><h2>My Products</h2><a href="#">See all</a></div>
        <div class="rail">
          <button class="arrow prev" id="prev" aria-label="Previous products" disabled><svg viewBox="0 0 14 14" fill="none"><path d="M9 3 5 7l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="track" id="track"></div>
          <button class="arrow next" id="next" aria-label="Next products"><svg viewBox="0 0 14 14" fill="none"><path d="m5 3 4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </article>
    </section>

    <section class="hold rise d6" aria-label="Holdings">
      <div class="bar">
        <div class="seg" role="tablist" aria-label="View">
          <button role="tab" aria-selected="true" data-v="list"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></svg>List View</button>
          <button role="tab" aria-selected="false" data-v="chart"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 13V8M6.3 13V4M9.7 13V9.5M13 13V6"/></svg>Chart View</button>
          <button role="tab" aria-selected="false" data-v="card"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/></svg>Card View</button>
          <button role="tab" aria-selected="false" data-v="news"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M5 6h6M5 8.5h6M5 11h3"/></svg>News and Updates</button>
        </div>
        <div class="seg" role="group" aria-label="Filter">
          <button aria-pressed="true" data-f="All">All<span class="count" id="cAll"></span></button>
          <button aria-pressed="false" data-f="Purchase">Purchase<span class="count" id="cPurchase"></span></button>
          <button aria-pressed="false" data-f="Withdraw">Withdraw<span class="count" id="cWithdraw"></span></button>
        </div>
      </div>
      <div id="view"></div>
    </section>
  </div>

  <aside class="ai rise d7" id="ai" aria-label="AI assistant">
    <button class="min" id="aiMin" aria-label="Collapse assistant" aria-expanded="true"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 8 6M8 2.5V6h3.5M2 12l4-4M6 11.5V8H2.5"/></svg></button>
    <div class="chips">
      <button data-q="help"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M7 1.5a5.5 5.5 0 0 0-4.8 8.2L1.5 12.5l2.9-.7A5.5 5.5 0 1 0 7 1.5Z"/></svg>Hi, how can I help?</button>
      <button data-q="suggest"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M7 1 8.2 5.8 13 7 8.2 8.2 7 13 5.8 8.2 1 7l4.8-1.2Z"/></svg>Generate Suggestions</button>
      <button data-q="data"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M5 11.5h4M5.5 13h3M7 1.5A4 4 0 0 0 4.5 8.6c.4.4.5.9.5 1.4h4c0-.5.2-1 .5-1.4A4 4 0 0 0 7 1.5Z"/></svg>Explore data opportunities</button>
      <button data-q="estate"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1.5 12.5h11M2.5 12.5V5l4-2.5v10M6.5 5.5l5 2v5M4 6.5v.01M4 9v.01M9 9v.01"/></svg>Explore real-estate</button>
    </div>
    <div class="ans" id="ans" aria-live="polite" hidden></div>
    <form class="ask" id="askForm">
      <span class="spk"><svg viewBox="0 0 18 18" fill="#111"><path d="M9 1.5 10.5 7.5 16.5 9 10.5 10.5 9 16.5 7.5 10.5 1.5 9 7.5 7.5Z"/></svg></span>
      <label for="q" style="position:absolute;left:-9999px">Ask AI</label>
      <input id="q" placeholder="Ask AI..." autocomplete="off">
      <button class="wave" type="button" id="wave" aria-label="Ask by voice"><i></i><i></i><i></i><i></i><i></i></button>
    </form>
  </aside>

  <div class="toast" id="toast" role="status"></div>
  <a class="ems-back" href="../../">← EMS Showcase</a>

  <script>
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $ = id => document.getElementById(id);
    const toast = $('toast'); let tt;
    const say = m => { toast.textContent = m; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 2000); };
    const n0 = v => Math.round(v).toLocaleString('en-US');

    /* ---------- nav capsule ---------- */
    $('caps').querySelectorAll('button').forEach(b => b.onclick = () => { $('caps').querySelectorAll('button').forEach(x => x.removeAttribute('aria-current')); b.setAttribute('aria-current', 'page'); });

    /* ---------- count-ups + live sparkline ---------- */
    document.querySelectorAll('[data-count]').forEach(el => {
      const to = +el.dataset.count; if (reduceMotion) return;
      const t0 = performance.now() + 300;
      const step = now => { const t = Math.max(0, Math.min(1, (now - t0) / 1400)), e = 1 - Math.pow(1 - t, 4); el.textContent = n0(to * e); if (t < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
    let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let pts = Array.from({ length: 30 }, (_, i) => 30 + Math.sin(i / 3) * 8 + rnd() * 10 - i * .5);
    function drawSpark() {
      const min = Math.min(...pts) - 4, max = Math.max(...pts) + 4;
      const d = pts.map((v, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 300).toFixed(1)} ${(64 - (v - min) / (max - min) * 60).toFixed(1)}`).join('');
      $('spLine').setAttribute('d', d); $('spArea').setAttribute('d', d + 'L300 64L0 64Z');
    }
    drawSpark();
    let live = 5353353;
    if (!reduceMotion) setInterval(() => {
      pts.shift(); pts.push(pts[pts.length - 1] + (rnd() - .42) * 5); drawSpark();
      live += Math.round((rnd() - .45) * 1800); $('liveAmt').textContent = n0(live);
      const p = 1.75 + (live - 5353353) / 5353353 * 100; $('chg').textContent = `${p.toFixed(2)}% (${(p - 1.86).toFixed(2)}%)`;
    }, 2400);

    /* ---------- products carousel ---------- */
    const products = [
      { t: 'Your Special Investment Opportunity', type: 'Property Investment', m: 'Save Profile', v: 76, c: 'linear-gradient(90deg,#9CC200,#C0E800)' },
      { t: 'Your Special Investment Opportunity', type: 'Property Investment', m: 'Risk Profile', v: 80, c: 'linear-gradient(90deg,#F59E0B,#EF4444)' },
      { t: 'Riyadh Logistics Hub Fund', type: 'Real Estate Fund', m: 'Risk Profile', v: 42, c: 'linear-gradient(90deg,#9CC200,#F59E0B)' },
      { t: 'Green Energy Income Note', type: 'Fixed Income', m: 'Save Profile', v: 88, c: 'linear-gradient(90deg,#9CC200,#C0E800)' }
    ];
    const track = $('track');
    track.innerHTML = products.map((p, i) => `<div class="pc">
        <div class="pc-top"><div><small>Product Title</small><h4>${p.t}</h4></div><button class="go" aria-label="Open ${p.t}"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 10 10 4M5 4h5v5"/></svg></button></div>
        <div class="pc-mid"><div><small>Type</small><b>${p.type}</b></div><div class="meter" style="--v:${p.v}%;--c:${p.c}"><i></i><span>${p.m}<b>${p.v}%</b></span></div></div>
        <button class="contrib" data-i="${i}">Contribute Funds</button></div>`).join('');
    let page = 0;
    const perView = () => innerWidth <= 560 ? 1 : 2;
    function slide() {
      const pv = perView(), maxP = Math.ceil(products.length / pv) - 1; page = Math.max(0, Math.min(maxP, page));
      const card = track.children[0], w = card.offsetWidth + 12;
      track.scrollLeft = page * pv * w;
      $('prev').disabled = page === 0; $('next').disabled = page === maxP;
    }
    $('next').onclick = () => { page++; slide(); }; $('prev').onclick = () => { page--; slide(); };
    track.addEventListener('click', e => { const b = e.target.closest('.contrib'); if (!b) return; b.classList.add('done'); b.textContent = '$5,000 contributed ✓'; say(`Contribution queued for “${products[b.dataset.i].t}”`); });

    /* ---------- holdings data ---------- */
    let assets = [
      ['Food Supply by AgriWise Global Ltd', 6035, [12, 20], '2027-07-20', 'Locked', 'Purchase'],
      ['Platinum', 400, [8, 12], '2028-08-05', 'Locked', 'Purchase'],
      ['Innovative Tech Company', 400, [15, 22], '2029-09-10', 'Locked', 'Purchase'],
      ['Property Management', 1200, [10, 14], '2030-10-15', 'Locked', 'Purchase'],
      ['Food Supply by AgriWise Global Ltd', 400, [12, 18], '2033-01-01', 'Locked', 'Purchase'],
      ['WG Fund 2', 850, [9, 13], '2031-11-25', 'Locked', 'Purchase'],
      ['Villa Rental Services', 400, [11, 16], '2032-12-30', 'Active', 'Purchase'],
      ['Innovative Tech Company', 400, [7, 10], '2029-12-10', 'Active', 'Purchase'],
      ['WG Fund 2', 600, [6, 9], '2031-08-25', 'Matured', 'Withdraw'],
      ['Platinum', 250, [5, 8], '2028-03-14', 'Matured', 'Withdraw']
    ].map((a, i) => ({ id: i, name: a[0], units: a[1], g: a[2], date: a[3], status: a[4], kind: a[5] }));
    const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    const lock = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="6.5" width="8" height="6" rx="1.5"/><path d="M4.8 6.5V4.8a2.2 2.2 0 0 1 4.4 0v1.7"/></svg>';
    const action = a => a.status === 'Locked' ? `<button class="act" data-a="req" data-id="${a.id}">${lock}Request to sell</button>`
      : a.status === 'Active' ? `<button class="act" data-a="sell" data-id="${a.id}">Sell Now</button>`
      : a.status === 'Matured' ? `<button class="act" data-a="wd" data-id="${a.id}">Withdraw</button>`
      : `<button class="act ghost" disabled>${a.pendingText || 'Request sent'}</button>`;

    let view = 'list', filter = 'All', sort = { key: null, dir: 1 };
    const sorters = { name: a => a.name, g: a => (a.g[0] + a.g[1]) / 2, date: a => a.date };
    function rows() {
      let r = assets.filter(a => filter === 'All' || a.kind === filter);
      if (sort.key) r = [...r].sort((x, y) => { const a = sorters[sort.key](x), b = sorters[sort.key](y); return (a > b ? 1 : a < b ? -1 : 0) * sort.dir; });
      return r;
    }
    const sortIcon = '<svg viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5 5 2l3 3M2 9l3 3 3-3"/></svg>';
    const thBtn = (k, label) => `<button data-sort="${k}" ${sort.key === k ? `data-dir="${sort.dir}" aria-sort="${sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${label}${sortIcon}</button>`;
    function render() {
      const r = rows(), v = $('view');
      ['All', 'Purchase', 'Withdraw'].forEach(f => $('c' + f).textContent = assets.filter(a => f === 'All' || a.kind === f).length);
      if (!r.length) { v.innerHTML = '<div class="empty">No holdings in this filter yet.</div>'; return; }
      if (view === 'list') {
        v.innerHTML = `<div class="tbl"><table><thead><tr><th>${thBtn('name', 'Asset Name')}</th><th>Bought Units</th><th>${thBtn('g', 'Growth')}</th><th>${thBtn('date', 'Maturity Date')}</th><th>Status</th><th>Action</th></tr></thead><tbody>
          ${r.map(a => `<tr><td>${a.name}</td><td>${a.units.toLocaleString('en-US')}</td><td>${a.g[0]}–${a.g[1]}% p.a.</td><td>${fmtDate(a.date)}</td><td><span class="st ${a.status}">${a.status}</span></td><td>${action(a)}</td></tr>`).join('')}</tbody></table></div>`;
      } else if (view === 'card') {
        v.innerHTML = `<div class="cards">${r.map(a => `<div class="ac"><h4>${a.name}</h4><div class="row">Units <b>${a.units.toLocaleString('en-US')}</b></div><div class="row">Growth <b>${a.g[0]}–${a.g[1]}% p.a.</b></div><div class="row">Matures <b>${fmtDate(a.date)}</b></div><div class="row">Status <span class="st ${a.status}">${a.status}</span></div>${action(a)}</div>`).join('')}</div>`;
      } else if (view === 'chart') {
        const W = v.clientWidth || 900, H = 360, L = 220, R = W - 30, top = 30, rowH = (H - top - 30) / r.length, max = 25;
        const x = p => L + p / max * (R - L);
        const col = { Locked: '#F0303A', Active: '#12C26A', Matured: '#2E7BF6', Pending: '#B7791F' };
        let s = `<text x="${L}" y="16">Projected growth range (% p.a.)</text>`;
        [0, 5, 10, 15, 20, 25].forEach(t => s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 30}" stroke="#EEF0F2"/><text x="${x(t)}" y="${H - 10}" text-anchor="middle">${t}%</text>`);
        r.forEach((a, i) => {
          const y = top + i * rowH + rowH / 2;
          s += `<text x="${L - 12}" y="${y + 4}" text-anchor="end">${a.name.length > 26 ? a.name.slice(0, 25) + '…' : a.name}</text>`;
          s += `<rect x="${x(a.g[0])}" y="${y - 7}" width="${x(a.g[1]) - x(a.g[0])}" height="14" rx="7" fill="#C0E800"><title>${a.name}: ${a.g[0]}–${a.g[1]}% p.a.</title></rect>`;
          s += `<circle cx="${x(a.g[1]) + 12}" cy="${y}" r="4" fill="${col[a.status]}"/>`;
        });
        v.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth range per holding">${s}</svg></div>`;
      } else {
        const news = [
          ['Fund', 'WG Fund 2 posts 11.4% for the quarter', 'Strong rental yields across the Gulf logistics portfolio lifted returns above target.', '2h ago'],
          ['Alert', 'Platinum lock-up ends in 30 days', 'Your 250-unit tranche becomes withdrawable on 14 March 2028.', 'Today'],
          ['Market', 'Agri-supply notes see record demand', 'AgriWise Global Ltd closes its third issuance oversubscribed 2.3×.', 'Yesterday'],
          ['Product', 'New: Green Energy Income Note', 'An 88% save-profile fixed-income product is now open to existing clients.', '3 days ago']
        ];
        v.innerHTML = `<div class="news">${news.map(n => `<div class="ni"><span class="tag">${n[0]}</span><div><b>${n[1]}</b><p>${n[2]}</p></div><time>${n[3]}</time></div>`).join('')}</div>`;
      }
    }
    document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-selected', x === b)); render(); });
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
    $('view').addEventListener('click', e => {
      const s = e.target.closest('[data-sort]');
      if (s) { const k = s.dataset.sort; sort = { key: k, dir: sort.key === k ? -sort.dir : 1 }; render(); return; }
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = assets.find(x => x.id === +b.dataset.id);
      if (b.dataset.a === 'req') { a.status = 'Pending'; a.pendingText = 'Request sent'; say(`Sell request sent for ${a.name}`); }
      if (b.dataset.a === 'sell') { a.status = 'Pending'; a.pendingText = 'Sold ✓'; say(`${a.units} units of ${a.name} sold`); }
      if (b.dataset.a === 'wd') { a.status = 'Pending'; a.pendingText = 'Withdrawn ✓'; a.kind = 'Withdraw'; say(`Withdrawal of ${a.name} is on its way`); }
      render();
    });

    /* ---------- AI assistant ---------- */
    const answers = {
      help: 'I can summarise your portfolio, explain a holding, or find opportunities. You hold 10 positions; 6 are locked until 2027–2033 and 2 have matured and can be withdrawn today.',
      suggest: 'Suggestion: withdraw the two matured positions (WG Fund 2 and Platinum) and move them into the Green Energy Income Note. That keeps your blended growth near 11% p.a. while lowering lock-up risk.',
      data: 'Your highest projected growth is Innovative Tech Company at 15–22% p.a. Food Supply exposure is 6,435 units across two notes, the largest single theme in your book.',
      estate: 'Real estate makes up 3 of your 10 holdings. Villa Rental Services is active and sellable now; the Riyadh Logistics Hub Fund in My Products has a moderate 42% risk profile.'
    };
    let typing;
    function answer(text) {
      const el = $('ans'); el.hidden = false; clearInterval(typing);
      if (reduceMotion) { el.textContent = text; return; }
      const w = text.split(' '); let i = 0;
      typing = setInterval(() => { el.innerHTML = w.slice(0, ++i).join(' ') + (i < w.length ? '<span class="caret"></span>' : ''); if (i >= w.length) clearInterval(typing); }, 35);
    }
    document.querySelectorAll('.chips button').forEach(b => b.onclick = () => answer(answers[b.dataset.q]));
    $('askForm').addEventListener('submit', e => {
      e.preventDefault(); const v = $('q').value.trim(); if (!v) return $('q').focus();
      const k = /estate|property|villa/i.test(v) ? 'estate' : /suggest|should|move/i.test(v) ? 'suggest' : /growth|best|data/i.test(v) ? 'data' : 'help';
      answer(answers[k]); $('q').value = '';
    });
    $('wave').onclick = () => { const w = $('wave'); w.classList.add('on'); $('q').placeholder = 'Listening…'; setTimeout(() => { w.classList.remove('on'); $('q').placeholder = 'Ask AI...'; answer(answers.suggest); }, 1800); };
    $('aiMin').onclick = () => { const ai = $('ai'), c = ai.classList.toggle('compact'); $('aiMin').setAttribute('aria-expanded', !c); $('aiMin').setAttribute('aria-label', c ? 'Expand assistant' : 'Collapse assistant'); };

    if (innerWidth <= 560) { $('ai').classList.add('compact'); $('aiMin').setAttribute('aria-expanded', false); $('aiMin').setAttribute('aria-label', 'Expand assistant'); }
    const boot = () => { render(); slide(); };
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(boot);
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { slide(); if (view === 'chart') render(); }, 120); });
  </script>
</body>
</html>
