<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pluvia Umbrella Model</title>
  <meta name="description" content="Procedural 3D umbrella for the Pluvia e-commerce experiment: open, close, spin and recolour it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    :root {
      --bg: #0e1014; --bg2: #1a1e26; --fg: #f3efe7; --muted: #9aa0ab;
      --line: rgba(243, 239, 231, .14); --accent: #e8a33d;
    }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 30%, var(--bg2) 0%, var(--bg) 62%);
      color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden;
    }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { width: 100% !important; height: 100% !important; cursor: grab; }
    #stage canvas:active { cursor: grabbing; }

    .brand {
      position: fixed; top: 20px; left: 20px; right: 20px; z-index: 2;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none;
    }
    .brand h1 { margin: 0; font: 600 clamp(22px, 3vw, 30px)/1 Fraunces, Georgia, serif; letter-spacing: .02em; }
    .brand h1 small { display: block; margin-top: 8px; font: 500 11px/1.4 Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .spec { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .spec b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

    .panel {
      position: fixed; z-index: 2; left: 50%; bottom: 20px; transform: translateX(-50%);
      width: min(640px, calc(100% - 32px));
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px 18px;
      padding: 14px 16px; border-radius: 18px;
      background: rgba(18, 21, 27, .66); border: 1px solid var(--line);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .btn {
      border: 0; border-radius: 999px; padding: 10px 18px; min-width: 96px;
      background: var(--fg); color: #111; font-weight: 600; font-size: 13px;
    }
    .btn:focus-visible, .swatch:focus-visible, .ghost:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .range { display: grid; gap: 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .range span b { color: var(--fg); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .swatches { display: flex; gap: 8px; }
    .swatch {
      width: 26px; height: 26px; border-radius: 50%; padding: 0;
      border: 2px solid transparent; background: conic-gradient(var(--a) 0 25%, var(--b) 0 50%, var(--a) 0 75%, var(--b) 0);
      box-shadow: 0 0 0 1px var(--line);
    }
    .swatch[aria-pressed=true] { border-color: var(--fg); }
    .row2 { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
    .ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--fg); }
    .ghost[aria-pressed=true] { background: rgba(243, 239, 231, .1); }

    .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }
    @media (max-width: 1000px) { .panel { bottom: 64px; } }

    @media (max-width: 640px) {
      .panel { grid-template-columns: 1fr auto; bottom: 64px; }
      .range { grid-column: 1 / -1; order: -1; }
      .spec { display: none; }
      .row2 { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <noscript><div class="fallback">This 3D model needs JavaScript and WebGL.</div></noscript>

  <div id="stage" aria-label="Interactive 3D umbrella. Drag to rotate, scroll or pinch to zoom." role="img"></div>

  <header class="brand">
    <h1>Pluvia<small>Model 01 · Atelier umbrella</small></h1>
    <div class="spec">
      Canopy span <b id="span">0 cm</b><br>
      8 fibreglass ribs · <b id="cw-name">Monsoon</b>
    </div>
  </header>

  <div class="panel">
    <button class="btn" id="toggle" type="button">Close</button>
    <label class="range">
      <span>Canopy <b id="pct">100%</b></span>
      <input id="open" type="range" min="0" max="100" value="100" aria-label="Canopy openness">
    </label>
    <div class="swatches" id="swatches" role="group" aria-label="Colourway"></div>
    <div class="row2">
      <span>Drag to rotate · scroll to zoom</span>
      <button class="ghost" id="spin" type="button" aria-pressed="true">Auto-spin</button>
    </div>
  </div>

  <a class="ems-back" href="../../">← EMS Showcase</a>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Config ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = 8;          // ribs / panels
const L = 1.15;       // rib length (scene units)
const U = 18, V = 36; // fabric grid per panel (across × along rib)
const CM = 52;        // cm per scene unit, for the span readout
const STRETCHER = 0.68, ATTACH = 0.5; // stretcher length, where it meets the rib (0..1 of L)
const TABLE = 160;

const COLORWAYS = [
  { name: 'Monsoon', a: '#1f2b47', b: '#e9e2d3', handle: '#6b3f22' },
  { name: 'Saffron', a: '#e8a33d', b: '#17181c', handle: '#2a1a10' },
  { name: 'Coral',   a: '#ff6b57', b: '#fff1e2', handle: '#c98b5a' },
  { name: 'Sage',    a: '#7f9c86', b: '#263029', handle: '#d9c7a4' },
];

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------- Renderer / scene ----------
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  stage.innerHTML = '<div class="fallback">WebGL is not available in this browser.</div>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
const TARGET = new THREE.Vector3(0, -0.85, 0);
const CAM_DIR = new THREE.Vector3(3.4, 0.9, 4.6).normalize();
camera.position.copy(CAM_DIR).multiplyScalar(6.2).add(TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.6;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.86; // allow peeking under the canopy

const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(3, 6, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 1, far: 15 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb8ff, 1.2);
rim.position.set(-4, 2, -4);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1d24, 0.35));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.24 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.16;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Materials ----------
const fabricMat = new THREE.MeshPhysicalMaterial({
  vertexColors: true, side: THREE.DoubleSide,
  roughness: 0.78, sheen: 0.6, sheenRoughness: 0.6, sheenColor: new THREE.Color(0.12, 0.12, 0.12), envMapIntensity: 0.45,
});
const steel = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, metalness: 1, roughness: 0.26 });
const ribMat = new THREE.MeshStandardMaterial({ color: 0x24272d, metalness: 0.55, roughness: 0.38 });
const handleMat = new THREE.MeshPhysicalMaterial({ color: 0x6b3f22, roughness: 0.42, clearcoat: 0.7, clearcoatRoughness: 0.25 });

// ---------- Umbrella ----------
const umbrella = new THREE.Group();
scene.add(umbrella);

// Rib profile: a curved rib whose start angle and curvature grow with openness t.
function ribTable(t, out) {
  const a0 = lerp(0.05, 1.5, t), k = lerp(0, 0.8, t);
  const ds = L / TABLE;
  let rho = 0, y = 0;
  out[0] = 0; out[1] = 0;
  for (let i = 1; i <= TABLE; i++) {
    const a = a0 - k * ((i - 0.5) * ds) / L;
    rho += Math.sin(a) * ds; y -= Math.cos(a) * ds;
    out[i * 2] = rho; out[i * 2 + 1] = y;
  }
  return out;
}
function sampleRib(tab, s, out) {
  const f = clamp(s / L, 0, 1) * TABLE;
  const i = Math.min(TABLE - 1, Math.floor(f)), w = f - i;
  out[0] = lerp(tab[i * 2], tab[i * 2 + 2], w);
  out[1] = lerp(tab[i * 2 + 1], tab[i * 2 + 3], w);
  return out;
}
const openTab = ribTable(1, new Float32Array((TABLE + 1) * 2));
const curTab = new Float32Array((TABLE + 1) * 2);

// Fabric: each panel has its own vertex grid so the rib seams stay crisp.
const vertsPerPanel = (U + 1) * (V + 1);
const fabricGeo = new THREE.BufferGeometry();
const pos = new Float32Array(N * vertsPerPanel * 3);
const col = new Float32Array(N * vertsPerPanel * 3);
fabricGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
fabricGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const index = [];
for (let p = 0; p < N; p++) {
  const base = p * vertsPerPanel;
  for (let u = 0; u < U; u++) for (let v = 0; v < V; v++) {
    const a = base + u * (V + 1) + v, b = a + (V + 1);
    index.push(a, b, a + 1, b, b + 1, a + 1);
  }
}
fabricGeo.setIndex(index);
const fabric = new THREE.Mesh(fabricGeo, fabricMat);
fabric.castShadow = true;
fabric.receiveShadow = true;
umbrella.add(fabric);

const tmpA = [0, 0], tmpO = [0, 0];
const chordK = 2 * Math.sin(Math.PI / N);
function updateFabric(t, time) {
  ribTable(t, curTab);
  const scallop = 0.075 * t;
  const ripple = reduce ? 0 : 0.006 * t;
  let i = 0;
  for (let p = 0; p < N; p++) {
    const ta = (p / N) * Math.PI * 2, tb = ((p + 1) / N) * Math.PI * 2;
    const ca = Math.cos(ta), sa = Math.sin(ta), cb = Math.cos(tb), sb = Math.sin(tb);
    for (let u = 0; u <= U; u++) {
      const fu = u / U, bell = Math.sin(Math.PI * fu);
      const th = lerp(ta, tb, fu), ct = Math.cos(th), st = Math.sin(th);
      for (let v = 0; v <= V; v++) {
        const s = (v / V) * L * (1 - scallop * bell);
        sampleRib(curTab, s, tmpA);
        sampleRib(openTab, s, tmpO);
        const rho = tmpA[0], y = tmpA[1];
        // straight chord between the two ribs
        let x = lerp(rho * ca, rho * cb, fu), z = lerp(rho * sa, rho * sb, fu);
        // folded state: spare cloth pleats outward; open state: slight taut sag inward
        const excess = Math.max(0, chordK * (tmpO[0] - rho));
        const push = 0.2 * excess * bell - 0.022 * t * bell * (s / L);
        x += ct * push; z += st * push;
        const yy = y + ripple * Math.sin(time * 2.1 + th * 3 + s * 5) * bell * (s / L);
        pos[i++] = x; pos[i++] = yy; pos[i++] = z;
      }
    }
  }
  fabricGeo.attributes.position.needsUpdate = true;
  fabricGeo.computeVertexNormals();
}

// Hardware
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 1.78, 16), steel);
shaft.position.y = -0.73;
const ferrule = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.2, 20), steel);
ferrule.position.y = 0.1;
const topNotch = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.038, 0.06, 24), ribMat);
topNotch.position.y = -0.01;
const runner = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.026, 0.1, 24), ribMat);
umbrella.add(shaft, ferrule, topNotch, runner);

const handleCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, -1.58, 0), new THREE.Vector3(0, -1.88, 0), new THREE.Vector3(0.03, -2.02, 0),
  new THREE.Vector3(0.125, -2.075, 0), new THREE.Vector3(0.215, -2.02, 0), new THREE.Vector3(0.24, -1.92, 0),
]);
const handle = new THREE.Mesh(new THREE.TubeGeometry(handleCurve, 64, 0.036, 20), handleMat);
const handleEnd = new THREE.Mesh(new THREE.SphereGeometry(0.036, 20, 12), handleMat);
handleEnd.position.copy(handleCurve.getPoint(1));
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.035, 24), steel);
collar.position.y = -1.58;
umbrella.add(handle, handleEnd, collar);

const ribs = [], stretchers = [], tips = [];
const tipGeo = new THREE.SphereGeometry(0.014, 12, 8);
const strGeo = new THREE.CylinderGeometry(0.0045, 0.0045, 1, 8);
strGeo.translate(0, 0.5, 0);
for (let i = 0; i < N; i++) {
  const r = new THREE.Mesh(new THREE.BufferGeometry(), ribMat);
  const st = new THREE.Mesh(strGeo, ribMat);
  const tp = new THREE.Mesh(tipGeo, steel);
  r.castShadow = st.castShadow = tp.castShadow = true;
  ribs.push(r); stretchers.push(st); tips.push(tp);
  umbrella.add(r, st, tp);
}
[shaft, ferrule, topNotch, runner, handle, handleEnd, collar].forEach(m => (m.castShadow = true));

const UP = new THREE.Vector3(0, 1, 0), v1 = new THREE.Vector3(), v2 = new THREE.Vector3();
function updateFrame(t) {
  const pts = [];
  for (let k = 0; k <= 24; k++) {
    sampleRib(curTab, (k / 24) * L, tmpA);
    pts.push([tmpA[0] * 0.99, tmpA[1] - 0.008]);
  }
  sampleRib(curTab, ATTACH * L, tmpA);
  const px = tmpA[0] * 0.99, py = tmpA[1] - 0.012;
  const runnerY = py - Math.sqrt(Math.max(0, STRETCHER * STRETCHER - px * px));
  runner.position.y = runnerY;

  for (let i = 0; i < N; i++) {
    const th = (i / N) * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
    const curve = new THREE.CatmullRomCurve3(pts.map(([r, y]) => new THREE.Vector3(r * c, y, r * s)));
    ribs[i].geometry.dispose();
    ribs[i].geometry = new THREE.TubeGeometry(curve, 32, 0.0065, 6);
    const [tr, ty] = pts[pts.length - 1];
    tips[i].position.set(tr * c, ty, tr * s);
    // stretcher: runner → rib
    v1.set(0.028 * c, runnerY + 0.03, 0.028 * s);
    v2.set(px * c, py, px * s);
    const st = stretchers[i];
    st.position.copy(v1);
    st.scale.y = v1.distanceTo(v2);
    st.quaternion.setFromUnitVectors(UP, v2.sub(v1).normalize());
  }
  document.getElementById('span').textContent = Math.round(2 * curTab[TABLE * 2] * CM) + ' cm';
}

// ---------- Colourways ----------
const colA = new THREE.Color(), colB = new THREE.Color(), colH = new THREE.Color();
const goalA = new THREE.Color(), goalB = new THREE.Color(), goalH = new THREE.Color();
function writeColors() {
  let i = 0;
  for (let p = 0; p < N; p++) {
    const c = p % 2 ? colB : colA;
    for (let k = 0; k < vertsPerPanel; k++) { col[i++] = c.r; col[i++] = c.g; col[i++] = c.b; }
  }
  fabricGeo.attributes.color.needsUpdate = true;
  handleMat.color.copy(colH);
}
const swatchWrap = document.getElementById('swatches');
function setColorway(idx, instant) {
  const cw = COLORWAYS[idx];
  goalA.set(cw.a); goalB.set(cw.b); goalH.set(cw.handle);
  if (instant) { colA.copy(goalA); colB.copy(goalB); colH.copy(goalH); writeColors(); }
  document.documentElement.style.setProperty('--accent', cw.a === '#17181c' ? cw.b : cw.a);
  document.getElementById('cw-name').textContent = cw.name;
  [...swatchWrap.children].forEach((b, j) => b.setAttribute('aria-pressed', j === idx));
}
COLORWAYS.forEach((cw, idx) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'swatch';
  b.style.setProperty('--a', cw.a); b.style.setProperty('--b', cw.b);
  b.setAttribute('aria-label', cw.name + ' colourway');
  b.onclick = () => setColorway(idx, reduce);
  swatchWrap.appendChild(b);
});
setColorway(0, true);

// ---------- Controls UI ----------
const slider = document.getElementById('open');
const pct = document.getElementById('pct');
const toggle = document.getElementById('toggle');
const spinBtn = document.getElementById('spin');
let t = reduce ? 1 : 0, target = 1, lastT = -1;
let spin = !reduce;
spinBtn.setAttribute('aria-pressed', spin);

slider.addEventListener('input', () => { target = slider.value / 100; if (reduce) t = target; });
toggle.addEventListener('click', () => {
  target = target > 0.5 ? 0 : 1;
  slider.value = target * 100;
  if (reduce) t = target;
});
spinBtn.addEventListener('click', () => { spin = !spin; spinBtn.setAttribute('aria-pressed', spin); });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const dist = 6.2 * clamp(1.15 / camera.aspect, 1, 2.1);
  camera.position.sub(controls.target).setLength(dist).add(controls.target);
}
addEventListener('resize', resize);
resize();

// ---------- Loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  if (!reduce) t += (target - t) * (1 - Math.exp(-dt * 3.2));
  if (Math.abs(target - t) < 1e-4) t = target;

  const eased = t * t * (3 - 2 * t);
  updateFabric(eased, time);
  if (Math.abs(eased - lastT) > 1e-5) { updateFrame(eased); lastT = eased; }

  if (!colA.equals(goalA) || !colH.equals(goalH)) {
    const k = 1 - Math.exp(-dt * 8);
    colA.lerp(goalA, k); colB.lerp(goalB, k); colH.lerp(goalH, k);
    if (Math.abs(colA.r - goalA.r) + Math.abs(colA.g - goalA.g) + Math.abs(colA.b - goalA.b) < 1e-3) {
      colA.copy(goalA); colB.copy(goalB); colH.copy(goalH);
    }
    writeColors();
  }

  toggle.textContent = target > 0.5 ? 'Close' : 'Open';
  pct.textContent = Math.round(t * 100) + '%';

  if (spin) umbrella.rotation.y += dt * 0.25;
  if (!reduce) umbrella.rotation.z = Math.sin(time * 0.7) * 0.025;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
