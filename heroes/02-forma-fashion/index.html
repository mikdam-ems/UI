<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORMA Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    /* Layout: one framed card; giant MOOD wordmark as the stage, copy pinned bottom-left, model between letter layers */
    :root {
      --sand: #EBE1D5;
      --card: #F4F3F5;
      --cobalt: #1B36A8;
      --orange: #FF7A00;
      --grey: #555555;
      --display: "Outfit", "Futura", "Century Gothic", system-ui, sans-serif;
      --body: "DM Sans", system-ui, sans-serif;
      --ease: cubic-bezier(.2, .8, .2, 1);
      color-scheme: light;
    }
    body { background: var(--sand); color: var(--grey); font-family: var(--body); padding: 16px; }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: var(--card);
      height: max(540px, calc(100svh - 32px));
      display: flex; flex-direction: column;
    }

    /* ---------- Nav ---------- */
    .nav {
      position: relative; z-index: 5;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 28px 48px;
    }
    .logo {
      font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: -.01em;
      color: var(--cobalt); text-decoration: none; justify-self: start;
    }
    .links { display: flex; gap: 44px; list-style: none; margin: 0; padding: 0; }
    .links a {
      font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase;
      color: var(--cobalt); text-decoration: none; position: relative; padding: 4px 0;
    }
    .links a::after {
      content: ""; position: absolute; left: 0; right: .22em; bottom: 0; height: 1px;
      background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease);
    }
    .links a:hover::after { transform: scaleX(1); }
    .cart {
      justify-self: end; position: relative;
      width: 44px; height: 44px; display: grid; place-items: center;
      background: none; border: 0; color: var(--cobalt);
    }
    .cart svg { width: 24px; height: 24px; }

    /* ---------- Stage ---------- */
    .stage { position: relative; flex: 1; min-height: 0; }
    .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    .glyph { font-family: var(--display); font-weight: 900; font-size: 400px; letter-spacing: 0; }
    .solid { fill: var(--cobalt); }
    .lens-edge { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 1.5; }
    #model, .back-letters { transition: transform .9s var(--ease); }

    /* ---------- Copy ---------- */
    .copy {
      position: absolute; z-index: 4; left: 48px; bottom: 48px;
      max-width: min(330px, 25vw);
    }
    .copy h1 {
      margin: 0; color: var(--cobalt);
      font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -.02em;
    }
    .copy p { margin: 14px 0 0; font-size: 13px; line-height: 1.65; color: var(--grey); }
    .cta {
      margin-top: 22px;
      display: inline-flex; align-items: center; gap: 12px;
      height: 46px; padding: 0 22px;
      border-radius: 6px; border: 0;
      background: var(--orange); color: #fff;
      font-family: var(--body); font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
      text-decoration: none;
      transition: transform .3s var(--ease), box-shadow .3s var(--ease);
    }
    .cta svg { width: 16px; height: 16px; transition: transform .3s var(--ease); }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(255,122,0,.6); }
    .cta:hover svg { transform: translateX(4px); }
    .cta:focus-visible, .links a:focus-visible, .cart:focus-visible, .logo:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 4px; }


    /* ---------- Motion ---------- */
    .rise { opacity: 0; transform: translateY(24px); animation: rise 1s var(--ease) forwards; }
    .d1 { animation-delay: .9s; } .d2 { animation-delay: 1.05s; } .d3 { animation-delay: 1.2s; }
    .back-letters use { opacity: 0; animation: letter 1.1s var(--ease) forwards; transform-box: fill-box; }
    .back-letters use:nth-child(2) { animation-delay: .12s; }
    .model-in { opacity: 0; animation: model 1.3s var(--ease) .25s forwards; }
    .lens-in { opacity: 0; animation: fade 1.2s ease .6s forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes letter { from { opacity: 0; transform: translateY(80px); } to { opacity: 1; transform: none; } }
    @keyframes model { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .back-letters use, .model-in, .lens-in { opacity: 1; transform: none; animation: none; }
    }

    /* ---------- Responsive ---------- */
    /* Short wide screens: keep the copy compact so it stays clear of the MOOD wordmark */
    @media (min-width: 761px) and (max-height: 780px) {
      .copy { bottom: 28px; left: 36px; }
      .copy h1 { font-size: 24px; }
      .copy p { margin-top: 8px; font-size: 12px; line-height: 1.5; }
      .cta { margin-top: 14px; height: 40px; }
    }
    @media (min-width: 761px) and (max-height: 680px) { .copy p { display: none; } }
    @media (max-width: 760px) {
      .nav { grid-template-columns: 1fr auto; padding: 20px 20px; }
      .links { display: none; }
    }
    @media (max-width: 760px), (max-aspect-ratio: 5/4) {
      body { padding: 8px; }
      .hero { height: auto; border-radius: 22px; }
      .stage { flex: none; aspect-ratio: 1400 / 700; margin-top: 32px; }
      .copy { position: static; padding: 8px 20px 32px; max-width: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <nav class="nav rise" style="animation-delay:.1s">
      <a class="logo" href="#">FORMA</a>
      <ul class="links">
        <li><a href="#">About</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Shop</a></li>
      </ul>
      <button class="cart" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4h2.2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.1"/>
          <circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>
        </svg>
      </button>
    </nav>

    <div class="stage">
      <svg id="scene" viewBox="0 0 1400 760" preserveAspectRatio="xMidYMax meet" role="img" aria-label="MOOD, with a model framed through the two O letters">
        <defs>
          <!-- Letters are defined once and reused by the solid layer, the lens mask and the lens edge -->
          <text id="tM" class="glyph" x="32" y="420">M</text>
          <text id="tO1" class="glyph" x="412" y="420">O</text>
          <text id="tO2" class="glyph" x="740" y="420">O</text>
          <text id="tD" class="glyph" x="1068" y="420">D</text>

          <clipPath id="lensClip"><use href="#tO1"/><use href="#tO2"/></clipPath>
          <filter id="frost" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>

          <radialGradient id="skin" cx="45%" cy="38%" r="70%">
            <stop offset="0" stop-color="#7A4733"/><stop offset=".65" stop-color="#5A3324"/><stop offset="1" stop-color="#40241A"/>
          </radialGradient>
          <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#30333B"/><stop offset="1" stop-color="#1A1C21"/>
          </linearGradient>
          <linearGradient id="lapel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B3F49"/><stop offset="1" stop-color="#262930"/>
          </linearGradient>
          <linearGradient id="sheen" x1="0" y1="0" x2=".6" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="afroShade" cx="40%" cy="30%" r="75%">
            <stop offset="0" stop-color="#2C221D"/><stop offset="1" stop-color="#140F0D"/>
          </radialGradient>
        </defs>

        <!-- Layer 1: solid M and D -->
        <g class="back-letters" id="backLetters">
          <use href="#tM" class="solid"/>
          <use href="#tD" class="solid"/>
        </g>

        <!-- Layer 2: the model -->
        <g class="model-in">
          <g id="modelPos" transform="translate(904 290)">
            <g id="model">
              <!-- cutout photo, offset so the face centre sits at 0,0 -->
              <image href="model.webp" x="-477" y="-318" width="1000" height="964"/>
            </g>
          </g>
        </g>

        <!-- Layer 3: the two O's as dark frosted glass over the model -->
        <g class="lens-in">
          <g clip-path="url(#lensClip)">
            <rect width="1400" height="760" fill="#F4F3F5"/>
            <use href="#modelPos" filter="url(#frost)"/>
            <rect width="1400" height="760" fill="#121833" opacity=".58"/>
            <rect width="1400" height="760" fill="url(#sheen)"/>
          </g>
          <use href="#tO1" class="lens-edge"/>
          <use href="#tO2" class="lens-edge"/>
        </g>
      </svg>
    </div>

    <div class="copy">
        <h1 class="rise d1">Made to stand out.</h1>
        <p class="rise d2">Confidence doesn’t ask for attention. It earns it. Find your own way forward and make an impression that lasts.</p>
        <a class="cta rise d3" href="#">Discover
          <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
  </section>

  <a class="ems-back" href="../../">← EMS Showcase</a>

  <script>
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const NS = 'http://www.w3.org/2000/svg';


    // Fit MOOD across the stage from the real font metrics, then sit her face inside the second O
    function layout() {
      const ids = ['tM', 'tO1', 'tO2', 'tD'].map(id => document.getElementById(id));
      const span = 1336, left = 32, base = 420, kern = -8;
      ids.forEach(t => t.style.fontSize = '400px');
      const widths = ids.map(t => t.getComputedTextLength());
      const total = widths.reduce((a, b) => a + b, 0) + kern * 3;
      const fs = 400 * span / total;
      let x = left;
      ids.forEach((t, i) => {
        t.style.fontSize = fs + 'px';
        t.setAttribute('x', x);
        t.setAttribute('y', base);
        x += widths[i] * fs / 400 + kern * fs / 400;
      });
      // Large editorial crop: hair rises above the letters, eyes sit behind the O lenses, shoulders bleed off the bottom
      const o = document.getElementById('tO2').getBBox();
      const scale = fs / 330;
      const eyeY = base - fs * .42;           // eye line through the middle of the letter band
      const cx = o.x + o.width * .3;          // face between the O's so the hair fills both lenses
      const cy = eyeY + 65 * scale;           // 65 = eye line to nose in the photo
      document.getElementById('modelPos').setAttribute('transform', `translate(${cx} ${cy}) scale(${scale})`);
    }
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(layout);

    // Depth on pointer: model drifts more than the letters, so the lenses refocus as you move
    if (!reduceMotion && matchMedia('(pointer: fine)').matches) {
      const model = document.getElementById('model');
      const back = document.getElementById('backLetters');
      addEventListener('pointermove', e => {
        const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
        model.style.transform = `translate(${x * 26}px, ${y * 12}px)`;
        back.style.transform = `translate(${x * -10}px, ${y * -4}px)`;
      });
    }
  </script>
</body>
</html>
