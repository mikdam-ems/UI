<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud.de</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    /* Layout: full-bleed painted sky with drifting clouds over rolling hills; centred serif headline; glass AI prompt card resting in the grass */
    :root {
      --sky-1: #0A6CC7;
      --sky-2: #62B2F2;
      --grass-1: #0E7238;
      --grass-2: #4CAF50;
      --ink: #0F172A;
      --serif: "Instrument Serif", "Playfair Display", Georgia, serif;
      --sans: "Inter", system-ui, sans-serif;
      --ease: cubic-bezier(.2, .8, .2, 1);
      color-scheme: light;
    }
    body { background: var(--sky-1); font-family: var(--sans); color: #fff; }

    .hero { position: relative; isolation: isolate; overflow: hidden; min-height: max(820px, 100svh); }
    .sky { position: absolute; inset: 0; z-index: -3; background: linear-gradient(180deg, var(--sky-1) 0%, #2F8DDE 38%, var(--sky-2) 70%, #A9D6F7 100%); }
    .sun { position: absolute; z-index: -3; top: -160px; right: 8%; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,250,225,.55), rgba(255,250,225,0)); pointer-events: none; }
    #clouds { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
    .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; z-index: -1; }
    .hills svg { width: 100%; height: 100%; display: block; }

    /* ---------- Nav ---------- */
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 48px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; font-weight: 600; font-size: 22px; letter-spacing: -.02em; }
    .badge-cloud { display: grid; place-items: center; width: 52px; height: 32px; border-radius: 999px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .badge-cloud svg { width: 24px; height: 24px; }
    .links { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; }
    .links a { color: #fff; text-decoration: none; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; opacity: .92; transition: opacity .2s; text-shadow: 0 1px 8px rgba(10,60,120,.25); }
    .links a:hover { opacity: 1; }
    .links svg { width: 12px; height: 12px; }
    .menu { display: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.15); color: #fff; place-items: center; }
    .menu svg { width: 16px; height: 16px; }

    /* ---------- Head ---------- */
    .head { text-align: center; padding: clamp(28px, 6vh, 72px) 16px 0; }
    h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(52px, 7.6vw, 116px); line-height: .98; letter-spacing: -.02em; text-shadow: 0 4px 30px rgba(8,50,110,.35); text-wrap: balance; }
    h1 em { font-style: italic; }
    .capsule {
      display: inline-block; margin-top: 26px; max-width: min(640px, 100%); padding: 12px 24px; border-radius: 999px;
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.85);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-size: 16px; line-height: 1.45; font-weight: 500; text-shadow: 0 1px 6px rgba(8,50,110,.25);
    }
    .cta-row { margin-top: 26px; }
    .cta {
      display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 30px; border-radius: 999px;
      background: linear-gradient(180deg, #fff 0%, #EEF4FA 100%); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 16px;
      box-shadow: inset 0 1px 0 #fff, 0 10px 30px -10px rgba(8,50,110,.55), 0 0 0 4px rgba(255,255,255,.18);
      transition: transform .25s var(--ease), box-shadow .25s;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 #fff, 0 16px 36px -12px rgba(8,50,110,.65), 0 0 0 6px rgba(255,255,255,.22); }

    /* ---------- AI card ---------- */
    .card {
      position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
      width: min(860px, calc(100% - 32px));
      padding: 26px 28px 24px; border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.42));
      border: 1px solid rgba(255,255,255,.75);
      backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
      box-shadow: 0 30px 70px -30px rgba(6,40,20,.55), inset 0 1px 0 rgba(255,255,255,.9);
      color: var(--ink);
    }
    .card::before { /* glass shine */
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(115deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 32%);
    }
    .welcome { position: relative; max-height: 60px; overflow: hidden; transition: max-height .5s var(--ease), margin .5s var(--ease), opacity .3s; margin: 0 0 18px; font-family: var(--serif); font-weight: 400; font-size: 34px; color: #6B7684; text-align: center; letter-spacing: -.01em; }
    .prompt {
      position: relative; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 10px; border-radius: 999px;
      background: rgba(226,240,252,.92); border: 1px solid rgba(255,255,255,.9);
      box-shadow: inset 0 2px 6px rgba(10,108,199,.08);
    }
    .agents { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; background: #111827; color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; border: 0; }
    .agents svg { width: 14px; height: 14px; color: #FACC15; }
    .prompt input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font: 16px var(--sans); color: var(--ink); }
    .prompt input::placeholder { color: #6B7A8C; }
    .prompt input:focus { outline: none; }
    .prompt:focus-within { box-shadow: inset 0 2px 6px rgba(10,108,199,.08), 0 0 0 3px rgba(10,108,199,.25); }
    .mic { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; color: var(--ink); display: grid; place-items: center; box-shadow: 0 4px 12px -4px rgba(15,23,42,.3); transition: background .25s; }
    .mic svg { width: 18px; height: 18px; }
    .mic .wave { display: none; gap: 2px; align-items: center; height: 16px; }
    .mic .wave i { width: 3px; border-radius: 2px; background: #fff; animation: wave .9s ease-in-out infinite; }
    .mic .wave i:nth-child(2) { animation-delay: .15s; } .mic .wave i:nth-child(3) { animation-delay: .3s; } .mic .wave i:nth-child(4) { animation-delay: .45s; }
    .mic.on { background: #0A6CC7; }
    .mic.on svg { display: none; } .mic.on .wave { display: flex; }
    .chips { position: relative; display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(15,23,42,.08); background: rgba(255,255,255,.75); color: #263241; font: 500 14px var(--sans); transition: background .2s, transform .2s var(--ease); }
    .chip:hover { background: #fff; transform: translateY(-1px); }
    .chip svg { width: 15px; height: 15px; color: #0A6CC7; }

    .card.asked .welcome { max-height: 0; margin-bottom: 0; opacity: 0; }
    .answer { position: relative; max-height: 0; overflow: hidden; transition: max-height .6s var(--ease), margin .6s var(--ease); }
    .answer.open { max-height: 220px; margin-top: 16px; }
    .answer-in { display: flex; gap: 12px; padding: 16px 18px; border-radius: 18px; background: rgba(255,255,255,.8); font-size: 15px; line-height: 1.55; color: #1F2937; text-align: left; }
    .bot { flex: none; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--sky-2), var(--sky-1)); display: grid; place-items: center; }
    .bot svg { width: 16px; height: 16px; }
    .caret { display: inline-block; width: 7px; height: 16px; margin-left: 2px; vertical-align: -2px; background: #0A6CC7; animation: blink 1s steps(1) infinite; }

    /* ---------- G2 ---------- */
    .g2 {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 16px 0 6px; border-radius: 999px;
      background: rgba(8,24,14,.55); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    .g2-logo { width: 28px; height: 28px; border-radius: 50%; background: #FF492C; display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: -.04em; }
    .stars { color: #FBBF24; letter-spacing: 2px; font-size: 14px; }

    .cta:focus-visible, .chip:focus-visible, .mic:focus-visible, .agents:focus-visible, .links a:focus-visible, .brand:focus-visible, .menu:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* ---------- Motion ---------- */
    .rise { opacity: 0; transform: translateY(18px); animation: rise 1s var(--ease) forwards; }
    .r1 { animation-delay: .05s; } .r2 { animation-delay: .2s; } .r3 { animation-delay: .35s; } .r4 { animation-delay: .5s; }
    .card.rise { transform: translate(-50%, 40px); animation: cardIn 1.1s var(--ease) .65s forwards; }
    .g2.rise { transform: translate(-50%, 12px); animation: g2In .9s var(--ease) .9s forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes cardIn { to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes g2In { to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes wave { 0%, 100% { height: 4px; } 50% { height: 16px; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .card.rise, .g2.rise { opacity: 1; animation: none; }
      .rise { transform: none; } .card.rise, .g2.rise { transform: translateX(-50%); }
      .answer { transition: none; }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1020px) { .links { display: none; } .menu { display: grid; } }
    @media (max-width: 640px) {
      .nav { padding: 18px 20px; }
      .hero { min-height: 100svh; display: flex; flex-direction: column; }
      .capsule { border-radius: 22px; font-size: 15px; padding: 12px 18px; }
      .card { position: relative; left: auto; bottom: auto; transform: none; margin: 40px auto 92px; padding: 20px 16px; }
      .card.rise { transform: translateY(40px); animation-name: rise; }
      .welcome { font-size: 28px; }
      .prompt { height: 56px; padding: 0 6px; }
      .agents { height: 42px; padding: 0 12px; font-size: 13px; }
      .prompt input { font-size: 15px; }
      .chips { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
      .chip { flex: none; }
      .hills { height: 52%; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="sky" aria-hidden="true"></div>
    <div class="sun" aria-hidden="true"></div>
    <canvas id="clouds" aria-hidden="true"></canvas>

    <!-- rolling hills -->
    <div class="hills" aria-hidden="true">
      <svg viewBox="0 0 1440 420" preserveAspectRatio="none">
        <defs>
          <linearGradient id="hBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6CC46A"/><stop offset="1" stop-color="#2E8B47"/></linearGradient>
          <linearGradient id="hMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4CAF50"/><stop offset="1" stop-color="#1E8A44"/></linearGradient>
          <linearGradient id="hFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E9A4B"/><stop offset="1" stop-color="#0E7238"/></linearGradient>
          <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE9FB" stop-opacity=".55"/><stop offset="1" stop-color="#CFE9FB" stop-opacity="0"/></linearGradient>
        </defs>
        <path d="M0 120 C220 60 420 70 620 110 C820 150 1000 40 1220 60 C1320 70 1390 90 1440 100 V420 H0Z" fill="url(#hBack)"/>
        <path d="M0 120 C220 60 420 70 620 110 C820 150 1000 40 1220 60 C1320 70 1390 90 1440 100 V170 H0Z" fill="url(#haze)"/>
        <path d="M0 200 C180 150 360 140 560 180 C760 220 960 150 1160 150 C1300 150 1380 170 1440 180 V420 H0Z" fill="url(#hMid)"/>
        <path id="ridge" d="M0 270 C200 230 420 220 720 250 C1000 280 1220 230 1440 240 V420 H0Z" fill="url(#hFront)"/>
        <g id="blades" stroke="#3DBA5F" stroke-width="1.6" stroke-linecap="round" opacity=".7"></g>
        <g id="flowers"></g>
      </svg>
    </div>

    <nav class="nav rise r1">
      <a class="brand" href="#">
        <span class="badge-cloud"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 9.1 4.75 4.75 0 0 0 7 18.5Z"/></svg></span>
        Cloud.de
      </a>
      <ul class="links">
        <li><a href="#">products <svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
        <li><a href="#">solutions <svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
        <li><a href="#">company <svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
        <li><a href="#">resources <svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
        <li><a href="#">pricing</a></li>
        <li><a href="#">docs</a></li>
      </ul>
      <button class="menu" aria-label="Open menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 5h12M2 11h12"/></svg></button>
    </nav>

    <header class="head">
      <h1 class="rise r2">Think Different.<br><em>Outside</em> Every Box.</h1>
      <div class="capsule rise r3">Utilize every tool our platform has to offer, and start exceeding in your profession.</div>
      <div class="cta-row rise r4"><a class="cta" href="#">Get Started – it’s free</a></div>
    </header>

    <section class="card rise" aria-label="AI workspace">
      <h2 class="welcome">Welcome, Robinzon</h2>
      <form class="prompt" id="promptForm" autocomplete="off">
        <button class="agents" type="button" aria-label="Choose an agent"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M8 .5 2 8h4l-1 5.5L12 6H8z"/></svg>Agents</button>
        <label for="ask" style="position:absolute;left:-9999px">Ask the assistant</label>
        <input id="ask" type="text" placeholder="Ask about deals, prospects, or pipeline health...">
        <button class="mic" id="mic" type="button" aria-label="Ask by voice">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6.5" y="2" width="5" height="9" rx="2.5"/><path d="M4 8.5a5 5 0 0 0 10 0M9 13.5V16"/></svg>
          <span class="wave"><i></i><i></i><i></i><i></i></span>
        </button>
      </form>
      <div class="chips">
        <button class="chip" type="button" data-q="email"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/><path d="m2.5 4.5 5.5 4 5.5-4"/></svg>Draft Email</button>
        <button class="chip" type="button" data-q="playbook"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 2.5h8l2 2v9H3z"/><path d="M5.5 7h5M5.5 10h3.5"/></svg>Build Playbook</button>
        <button class="chip" type="button" data-q="summary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 3h9M3.5 6.5h9M3.5 10h6M3.5 13.5h4"/></svg>Summarize Call</button>
        <button class="chip" type="button" data-q="coach"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8 9.7 6l4.5.3-3.5 2.9 1.1 4.4L8 11.2l-3.8 2.4 1.1-4.4-3.5-2.9L6.3 6z"/></svg>Coach Me</button>
      </div>
      <div class="answer" id="answer" aria-live="polite">
        <div class="answer-in">
          <span class="bot"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 9.1 4.75 4.75 0 0 0 7 18.5Z"/></svg></span>
          <p id="answerText" style="margin:0"></p>
        </div>
      </div>
    </section>

    <div class="g2 rise" aria-label="Rated 4.9 out of 5 on G2">
      <span class="g2-logo">G2</span><span class="stars" aria-hidden="true">★★★★★</span>4.9
    </div>
  </section>

  <a class="ems-back" href="../../">← EMS Showcase</a>

  <script>
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const NS = 'http://www.w3.org/2000/svg';
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    /* ---------- grass blades + wildflowers along the front ridge ---------- */
    (() => {
      const ridge = document.getElementById('ridge'), blades = document.getElementById('blades'), flowers = document.getElementById('flowers');
      const len = ridge.getTotalLength(); let d = '';
      for (let s = 0; s < len; s += 5) {
        const p = ridge.getPointAtLength(s); if (p.y > 300 || p.x > 1440) continue;
        const h = 6 + rnd() * 12, lean = (rnd() - .5) * 8;
        d += `M${p.x.toFixed(1)} ${(p.y + 3).toFixed(1)} q${(lean / 2).toFixed(1)} ${(-h / 2).toFixed(1)} ${lean.toFixed(1)} ${(-h).toFixed(1)}`;
      }
      const path = document.createElementNS(NS, 'path'); path.setAttribute('d', d); blades.appendChild(path);
      for (let i = 0; i < 60; i++) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', rnd() * 1440); c.setAttribute('cy', 270 + rnd() * 140); c.setAttribute('r', 1.4 + rnd() * 1.6);
        c.setAttribute('fill', ['#FFFFFF', '#FDE68A', '#F9A8D4'][i % 3]); c.setAttribute('opacity', .75);
        flowers.appendChild(c);
      }
    })();

    /* ---------- painted clouds, pre-rendered once then drifted ---------- */
    const cv = document.getElementById('clouds'), ctx = cv.getContext('2d');
    let W = 0, H = 0, clouds = [], mx = 0;
    function paintCloud(w, h) {
      const off = document.createElement('canvas'); off.width = w; off.height = h;
      const c = off.getContext('2d');
      const puffs = 26 + Math.floor(rnd() * 14);
      for (let i = 0; i < puffs; i++) {
        const px = w * (.2 + rnd() * .6), py = h * (.5 + rnd() * .18) - Math.sin((px / w) * Math.PI) * h * .16;
        const r = Math.min(h * (.16 + rnd() * .2), px, w - px, py, h - py);   // keep every puff inside its canvas so edges stay soft
        const g = c.createRadialGradient(px - r * .25, py - r * .35, r * .1, px, py, r);
        g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.55, 'rgba(250,252,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = g; c.beginPath(); c.arc(px, py, r, 0, 6.283); c.fill();
      }
      // cool shadow on the underside
      c.globalCompositeOperation = 'source-atop';
      const sh = c.createLinearGradient(0, h * .45, 0, h); sh.addColorStop(0, 'rgba(160,190,225,0)'); sh.addColorStop(1, 'rgba(120,160,210,.45)');
      c.fillStyle = sh; c.fillRect(0, 0, w, h);
      return off;
    }
    function setup() {
      const dpr = Math.min(2, devicePixelRatio || 1), r = cv.getBoundingClientRect();
      W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed = 99; clouds = [];
      const n = Math.max(5, Math.round(W / 220));
      for (let i = 0; i < n; i++) {
        const depth = .4 + rnd() * .6;                       // 0.4 far … 1 near
        const w = (260 + rnd() * 360) * depth * Math.min(1.3, W / 1200 + .4), h = w * (.42 + rnd() * .12);
        clouds.push({ img: paintCloud(Math.round(w), Math.round(h)), x: rnd() * (W + w) - w / 2, y: H * (.06 + rnd() * .42) - h / 2, w, h, depth, speed: 4 + depth * 10, a: .65 + depth * .35 });
      }
      clouds.sort((a, b) => a.depth - b.depth);
    }
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      ctx.clearRect(0, 0, W, H);
      for (const c of clouds) {
        if (!reduceMotion) { c.x += c.speed * dt; if (c.x > W + 20) c.x = -c.w - 20; }
        ctx.globalAlpha = c.a;
        ctx.drawImage(c.img, c.x + mx * c.depth * 18, c.y);
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    setup(); requestAnimationFrame(frame);
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 150); });
    if (!reduceMotion && matchMedia('(pointer: fine)').matches) addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; });

    /* ---------- AI prompt: typed placeholders, chips, voice, streamed answers ---------- */
    const input = document.getElementById('ask'), answer = document.getElementById('answer'), out = document.getElementById('answerText'), mic = document.getElementById('mic');
    const replies = {
      email: ['Draft a follow-up email to Lena at Nordwind', 'Here’s a draft: “Hi Lena, thanks for Tuesday’s call. I’ve attached the revised proposal with the three-year term you asked about, plus the onboarding timeline. Could we lock in a 20-minute review on Thursday?”'],
      playbook: ['Build a playbook for mid-market logistics deals', 'Playbook ready with 5 stages: discovery call script, ROI calculator, security pack, pilot plan and a close checklist. Teams using it closed 23% faster last quarter.'],
      summary: ['Summarize my call with Brightlane', 'Brightlane call, 32 min: budget approved for Q4, legal review needed by 15 Oct, main concern is SSO setup. Next step: send the security pack and book IT for Monday.'],
      coach: ['Coach me before the Helix renewal', 'Lead with usage: Helix grew seats 41% this year. Expect a discount ask; trade it for a 2-year term. Avoid opening with price. Bring their new CFO into the second meeting.'],
      default: ['', 'Pipeline health: 42 open deals worth €1.8M. 6 have stalled for more than 14 days, mostly at legal review. Top priority: Nordwind (€240K), no reply in 9 days.']
    };
    let streamTimer, typeTimer;
    function stream(text) {
      clearInterval(streamTimer);
      document.querySelector('.card').classList.add('asked');
      answer.classList.add('open'); out.innerHTML = '';
      if (reduceMotion) { out.textContent = text; return; }
      const words = text.split(' '); let i = 0;
      streamTimer = setInterval(() => {
        out.innerHTML = words.slice(0, ++i).join(' ') + (i < words.length ? '<span class="caret"></span>' : '');
        if (i >= words.length) clearInterval(streamTimer);
      }, 45);
    }
    function typeInto(text, then) {
      clearInterval(typeTimer); input.value = '';
      if (reduceMotion) { input.value = text; then(); return; }
      let i = 0; typeTimer = setInterval(() => { input.value = text.slice(0, ++i); if (i >= text.length) { clearInterval(typeTimer); setTimeout(then, 250); } }, 22);
    }
    document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
      const [q, a] = replies[c.dataset.q]; typeInto(q, () => stream(a));
    }));
    document.getElementById('promptForm').addEventListener('submit', e => {
      e.preventDefault(); if (!input.value.trim()) { input.focus(); return; }
      stream(replies.default[1]);
    });
    mic.addEventListener('click', () => {
      if (mic.classList.contains('on')) return;
      mic.classList.add('on'); mic.setAttribute('aria-label', 'Listening');
      setTimeout(() => { mic.classList.remove('on'); mic.setAttribute('aria-label', 'Ask by voice'); typeInto('How healthy is my Q4 pipeline?', () => stream(replies.default[1])); }, 1800);
    });

    // rotating placeholder hints while the field is empty
    const hints = ['Ask about deals, prospects, or pipeline health...', 'Which deals are at risk this month?', 'Prep me for tomorrow’s Helix renewal...'];
    let h = 0;
    if (!reduceMotion) setInterval(() => { if (document.activeElement !== input && !input.value) input.placeholder = hints[h = (h + 1) % hints.length]; }, 4000);
  </script>
</body>
</html>
